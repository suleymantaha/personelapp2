name: personelapp2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.6
  cryptography: 2.9.0
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fuzzy: ^0.5.1
  go_router: ^17.3.0
  intl: ^0.20.3
  material_design_icons_flutter: ^7.0.7296
  path: ^1.9.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  sqlite3: 3.5.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_modern_1024.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon_modern_1024.png
    background_color: "#24301C"
    theme_color: "#4A5D36"
  windows:
    generate: true
    image_path: assets/branding/app_icon_modern_1024.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon_modern_1024.png
