name: Android Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Drift database
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Upload generated database source
        uses: actions/upload-artifact@v4
        with:
          name: generated-database
          path: lib/core/database/database.g.dart

      - name: Run Heybet identity regression
        timeout-minutes: 3
        run: flutter test --reporter expanded --timeout 2m test/unit/combined_heybet_identity_test.dart

      - name: Run selected card ordering regression
        timeout-minutes: 3
        run: flutter test --reporter expanded --timeout 2m test/unit/combined_heybet_selection_test.dart

      - name: Run output preparation page regressions
        timeout-minutes: 4
        run: >-
          flutter test --reporter expanded --timeout 2m
          test/unit/selected_roster_output_test.dart
          test/features/activity/roster_output_screen_test.dart

      - name: Run Heybet output regressions
        timeout-minutes: 4
        run: >-
          flutter test --reporter expanded --timeout 2m
          test/unit/heybet_print_layout_test.dart
          test/features/activity/separate_heybet_excel_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run bulk import navigation regressions
        timeout-minutes: 3
        run: >-
          flutter test --reporter expanded --timeout 2m
          test/features/activity/bulk_import_card_expansion_test.dart
          test/features/activity/bulk_import_wizard_test.dart
          test/features/activity/bulk_import_validation_progress_test.dart

      - name: Run navigation dismissal regressions
        timeout-minutes: 3
        run: flutter test --reporter expanded --timeout 2m test/features/activity/navigation_dismissal_regression_test.dart

      - name: Run export permission regressions
        timeout-minutes: 3
        run: flutter test --reporter expanded --timeout 2m test/features/activity/approved_roster_export_test.dart

      - name: Run stability regressions
        timeout-minutes: 8
        run: >-
          flutter test --reporter expanded --timeout 2m
          test/features/personnel/personnel_search_service_test.dart
          test/features/activity/edit_activity_block_dialog_test.dart
          test/features/matrix/monthly_matrix_team_groups_test.dart
          test/features/activity/bulk_add_personnel_to_activity_test.dart
          test/unit/stability_regression_test.dart
          test/unit/personnel_identity_regression_test.dart
          test/unit/history_and_ledger_regression_test.dart
          test/features/activity/bulk_activity_import_preparer_test.dart
          test/core/database/database_migration_test.dart
          test/core/services/commander_scope_provider_test.dart
          test/core/services/app_backup_service_test.dart
          test/features/temgundrap/temgundrap_stability_test.dart

      - name: Run tests
        timeout-minutes: 8
        run: flutter test --reporter expanded --timeout 2m

      - name: Verify rendered Heybet print layout
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 tool/verify_heybet_print.py

      - name: Upload Heybet print previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heybet-print-previews
          path: build/heybet-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Calculate app version
        id: version
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME"
          echo "versionCode=$VERSION_CODE"

      - name: Configure release signing (if secrets provided)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Keystore secrets found, configuring signing properties..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=upload-keystore.jks\n'
            } > android/key.properties
          else
            echo "No keystore secrets found, building unsigned release APK."
          fi

      - name: Build Release APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/personelapp2-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personelapp2-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: build/app/outputs/flutter-apk/personelapp2-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
          if-no-files-found: error
          retention-days: 7


      - name: One-time cleanup of merged branches and older Android Release runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[one-shot-maintenance-20261015]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in 35 36; do
            merged="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.merged')"
            if [[ "$merged" != "true" ]]; then
              echo "PR #$pr is not merged; aborting cleanup." >&2
              exit 1
            fi
          done

          previous="$(gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=100" --jq '.workflow_runs | map(select(.name == "Android Release" and .conclusion == "success")) | .[0].id')"
          if [[ -z "$previous" || "$previous" == "null" || "$previous" == "$GITHUB_RUN_ID" ]]; then
            echo "No previous successful main build to retain." >&2
            exit 1
          fi
          active="$(gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name == "Android Release" and .status != "completed") | .id')"
          for id in $active; do
            if [[ "$id" != "$GITHUB_RUN_ID" ]]; then
              echo "Another Android Release is still running ($id); aborting cleanup." >&2
              exit 1
            fi
          done
          echo "Retaining previous successful main build $previous and current build $GITHUB_RUN_ID."

          # Restore the original workflow via GITHUB_TOKEN: this push does not start another CI.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main changed during maintenance; aborting cleanup." >&2
            exit 1
          fi
          git show HEAD^:.github/workflows/android-release.yml > .github/workflows/android-release.yml
          git add .github/workflows/android-release.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(ci): restore normal workflow after one-time cleanup'
          git push origin HEAD:main

          # The two feature branches are confirmed merged above; main is never touched.
          for branch in feat/matrix-compact-calendar-day-sheet ui/activity-archive-clean-redesign-20261015; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted merged branch: $branch"
          done

          # Keep exactly two Android Release records: the current run and previous success.
          run_ids="$(gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name == "Android Release") | .id')"
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            if [[ "$id" == "$GITHUB_RUN_ID" || "$id" == "$previous" ]]; then
              continue
            fi
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null
            echo "Deleted obsolete Android Release run: $id"
          done <<< "$run_ids"

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/personelapp2-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
