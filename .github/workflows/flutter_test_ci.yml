name: Flutter Shopping & Debt Modules Test CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit, Widget & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Mocks via Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests with LCOV Coverage
        run: flutter test --coverage test/unit test/widget

      - name: Verify Integration Test Suite
        run: flutter test integration_test

      - name: Build Release APKs
        run: flutter build apk --release

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          retention-days: 3

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

      - name: Post Build Workspace Cleanup
        if: always()
        run: |
          flutter clean
          rm -rf build/ coverage/

